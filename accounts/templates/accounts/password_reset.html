<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازیابی رمز عبور</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #0f172a, #020617);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .reset-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            width: 95%;
            max-width: 420px;
            padding: 50px 35px;
            color: #e2e8f0;
            text-align: center;
        }

        h2 {
            font-weight: 600;
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            font-size: 1rem;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
            background-color: rgba(255, 255, 255, 0.15);
        }

        button {
            background: linear-gradient(90deg, #0ea5e9, #38bdf8);
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        button:hover {
            background: linear-gradient(90deg, #38bdf8, #0ea5e9);
            transform: scale(1.03);
        }

        .back-link {
            display: block;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #60a5fa;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #93c5fd;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <h2>بازیابی رمز عبور</h2>
        <p>آدرس ایمیل خود را وارد کنید تا لینک بازیابی رمز عبور برای شما ارسال شود.</p>
        
        <form method="post">
            {% csrf_token %}
            {% if form.email.errors %}
                <div style="color: #ef4444; margin-bottom: 10px; font-size: 0.9rem;">
                    {% for error in form.email.errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            <input type="email" name="email" placeholder="آدرس ایمیل" required>
            <button type="submit">ارسال لینک بازیابی</button>
        </form>
        
        <a href="{% url 'login' %}" class="back-link">بازگشت به صفحه ورود</a>
    </div>
</body>
</html>
