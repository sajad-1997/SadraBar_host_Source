<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لینک بازیابی ارسال شد</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #0f172a, #020617);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            width: 95%;
            max-width: 420px;
            padding: 50px 35px;
            color: #e2e8f0;
            text-align: center;
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        h2 {
            font-weight: 600;
            font-size: 1.6rem;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .back-link {
            display: inline-block;
            font-size: 0.9rem;
            color: #60a5fa;
            text-decoration: none;
            transition: 0.3s;
            padding: 10px 20px;
            border: 1px solid #60a5fa;
            border-radius: 8px;
        }

        .back-link:hover {
            background-color: #60a5fa;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h2>لینک بازیابی ارسال شد</h2>
        <p>لینک بازیابی رمز عبور به آدرس ایمیل شما ارسال شد. لطفاً ایمیل خود را بررسی کنید و روی لینک کلیک کنید.</p>
        <p style="font-size: 0.85rem; color: #64748b;">اگر ایمیل دریافت نکردید، پوشه اسپم را نیز بررسی کنید.</p>
        
        <a href="{% url 'login' %}" class="back-link">بازگشت به صفحه ورود</a>
    </div>
</body>
</html>
