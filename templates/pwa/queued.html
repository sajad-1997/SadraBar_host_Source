{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>در صف همگام‌سازی | صدرابار</title>
    {% include "pwa/head.html" %}
    <link rel="stylesheet" href="{% static 'pwa/offline.css' %}">
    <style>
        .sync-status {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .sync-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .sync-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #0f766e;
        }
        .sync-text {
            color: #64748b;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .sync-count {
            background: #e0f2fe;
            color: #0369a1;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        .sync-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .sync-button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sync-button-primary {
            background: #0f766e;
            color: white;
        }
        .sync-button-primary:hover {
            background: #0d655f;
        }
        .sync-button-secondary {
            background: #e2e8f0;
            color: #475569;
        }
        .sync-button-secondary:hover {
            background: #cbd5e1;
        }
    </style>
</head>
<body>
<main class="offline-shell">
    <section class="sync-status" aria-labelledby="sync-title">
        <svg class="sync-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 21h5v-5"/>
        </svg>
        <h1 id="sync-title" class="sync-title">در حال همگام‌سازی</h1>
        <p class="sync-text">
            درخواست شما ثبت شد و به محض اتصال به اینترنت به سرور ارسال خواهد شد.
            می‌توانید در این صفحه منتظر بمانید یا به صفحه اصلی بازگردید.
        </p>
        <div class="sync-count" id="sync-count">در حال بررسی...</div>
        <div class="sync-actions">
            <button type="button" class="sync-button sync-button-primary" onclick="window.location.reload()">بررسی وضعیت</button>
            <a href="/" class="sync-button sync-button-secondary">بازگشت به صفحه اصلی</a>
        </div>
    </section>
</main>
{% include "pwa/scripts.html" %}
<script>
    (function() {
        const DB_NAME = "SadraBarOutbox";
        const DB_VERSION = 1;
        const STORE_NAME = "requests";

        async function getPendingCount() {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, "readonly");
                const store = tx.objectStore(STORE_NAME);
                const count = await store.count();
                await tx.done;
                await db.close();
                return count;
            } catch (error) {
                console.error("Failed to get pending count", error);
                return 0;
            }
        }

        async function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
                    }
                };
            });
        }

        async function updateCount() {
            const count = await getPendingCount();
            const countEl = document.getElementById("sync-count");
            if (countEl) {
                if (count === 0) {
                    countEl.textContent = "همه درخواست‌ها همگام شدند";
                    countEl.style.background = "#dcfce7";
                    countEl.style.color = "#166534";
                } else {
                    countEl.textContent = `${count} درخواست در صف همگام‌سازی`;
                }
            }
        }

        updateCount();
        setInterval(updateCount, 3000);

        window.addEventListener("online", () => {
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });
    })();
</script>
</body>
</html>
