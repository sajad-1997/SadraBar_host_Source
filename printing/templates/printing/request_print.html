<!DOCTYPE html>
<html dir="rtl">
<head><meta charset="UTF-8"><title>درخواست چاپ بارنامه</title></head>
<body>
    <h2>درخواست چاپ بارنامه</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">بررسی و ارسال کد</button>
    </form>
    {% if messages %}
        <ul>{% for msg in messages %}<li>{{ msg }}</li>{% endfor %}</ul>
    {% endif %}
</body>
</html>
