{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include "pwa/head.html" %}
    <title>{% block title %}پنل مدیریت{% endblock %}</title>

    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- فونت فارسی -->
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/index.css" rel="stylesheet">

    <!-- استایل اصلی داشبورد -->
    <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
    
    <style>
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #181a1f;
                color: #e4e4e4;
            }
            .navbar {
                background: linear-gradient(90deg, #2a2d55, #3c3f72);
            }
            .main-content {
                color: #e4e4e4;
            }
            .card {
                background-color: #2b2e36;
                border-color: #3d414a;
            }
            .table {
                color: #e4e4e4;
            }
            .table thead th {
                background-color: #2b2e36;
                border-color: #3d414a;
            }
            .form-control {
                background-color: #2b2e36;
                border-color: #3d414a;
                color: #e4e4e4;
            }
            .form-control:focus {
                background-color: #2b2e36;
                border-color: #8f94fb;
                color: #e4e4e4;
            }
            .btn-light {
                background-color: #2b2e36;
                border-color: #3d414a;
                color: #e4e4e4;
            }
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-brand">🚛 پنل مدیریت اپلیکیشن صدرابار</span>

        <div class="user-info">
            <span>سلام، {{ user.username }} 👋🏻</span>
            <a href="{% url 'logout' %}" class="logout-btn">خروج</a>
        </div>
    </div>
</nav>

<!-- Dashboard Layout -->
<div class="dashboard-container">

    <!-- Sidebar -->
{#    <div class="sidebar">#}
{#        <h4>منوی دسترسی</h4>#}
{#        {% include 'dashboard/sidebar.html' %}#}
{#    </div>#}

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

</div>

{% include "pwa/scripts.html" %}

</body>
</html>
