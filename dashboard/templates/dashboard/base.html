{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پنل مدیریت{% endblock %}</title>

    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- فونت فارسی -->
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/index.css" rel="stylesheet">

    <!-- استایل اصلی داشبورد -->
    <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-brand">🚛 پنل مدیریت اپلیکیشن صدرابار</span>

        <div class="user-info">
            <span>سلام، {{ user.username }} 👋🏻</span>
            <a href="{% url 'logout' %}" class="logout-btn">خروج</a>
            <button class="mode-toggle" id="modeToggle" title="تغییر حالت">🌙</button>
        </div>
    </div>
</nav>

<!-- Dashboard Layout -->
<div class="dashboard-container">

    <!-- Sidebar -->
{#    <div class="sidebar">#}
{#        <h4>منوی دسترسی</h4>#}
{#        {% include 'dashboard/sidebar.html' %}#}
{#    </div>#}

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

</div>

<!-- JS -->
<script>
    const toggleBtn = document.getElementById('modeToggle');
    toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        toggleBtn.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        toggleBtn.textContent = '☀️';
    }
</script>

</body>
</html>
