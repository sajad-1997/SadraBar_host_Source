{% load static %}
{% load humanize %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include "pwa/head.html" %}

    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="{% static 'issuance/css/bootstrap.rtl.min.css' %}">
    
    <!-- فونت فارسی -->
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/index.css" rel="stylesheet">
    
    <!-- Global Theme CSS -->
    <link rel="stylesheet" href="{% static 'global/css/theme.css' %}">

    <!-- Persian Datepicker CSS -->
    <link rel="stylesheet" href="{% static 'issuance/css/persian-datepicker.css' %}">

    <style>
        body { font-family: "Vazirmatn", Tahoma, sans-serif; background-color: var(--global-bg); padding: 10px; }
        h2 { text-align: center; color: var(--global-accent); font-weight: 700; margin-bottom: 20px; }

        /* دکمه‌های بالای صفحه */
        .top-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .top-buttons a { flex: 1 1 150px; }

        /* فرم فیلتر - Mobile App Style */
        .filter-card { 
            margin-bottom: 20px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            padding: 20px; 
            background: var(--global-card-bg); 
            border: 1px solid var(--global-border);
        }
        
        .filter-card input, 
        .filter-card button, 
        .filter-card a { 
            border-radius: 12px; 
            padding: 14px 16px; 
            font-size: 0.95rem; 
            border: 1px solid var(--global-border);
            transition: all 0.3s ease;
            height: auto;
        }
        
        .filter-card input:focus { 
            border-color: var(--global-accent); 
            box-shadow: 0 0 0 3px rgba(13,110,253,0.1); 
            outline: none;
            border-width: 2px;
        }
        
        .filter-card input::placeholder {
            color: var(--global-muted);
        }
        
        .filter-card button { 
            background: linear-gradient(135deg, #0d6efd, #0056b3);
            color: #fff; 
            border: none;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(13,110,253,0.3);
        }
        
        .filter-card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13,110,253,0.4);
        }
        
        .filter-card button:active {
            transform: translateY(0);
        }
        
        .filter-card a { 
            text-decoration: none; 
            display: inline-block; 
            text-align: center;
            background: #f8f9fa;
            color: #495057;
            font-weight: 500;
        }
        
        .filter-card a:hover {
            background: #e9ecef;
        }

        /* کارت بارنامه - Mobile App Style */
        .bijak-card {
            background: var(--global-card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 16px;
            padding: 20px;
            border: 1px solid var(--global-border);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .bijak-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.12);
        }
        
        .bijak-header { 
            font-weight: 700; 
            margin-bottom: 12px; 
            color: var(--global-accent); 
            font-size: 1.05rem;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--global-border);
        }
        
        .bijak-row { 
            display: flex; 
            justify-content: space-between; 
            flex-wrap: wrap; 
            margin-bottom: 8px;
            gap: 8px;
        }
        
        .bijak-row span { 
            flex: 1 1 45%; 
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        .bijak-row span b {
            color: var(--global-text);
            font-weight: 600;
        }
        
        .btn-group-card { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid var(--global-border);
        }
        
        .btn-group-card .btn {
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        
        .btn-group-card .btn:hover {
            transform: translateY(-1px);
        }

        /* دسکتاپ جدول - Modern Style */
        @media (min-width: 992px) {
            .bijak-card { display: none; }
            .desktop-table { 
                display: table; 
                width: 100%; 
                border-collapse: collapse;
                background: var(--global-card-bg);
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            }
            .desktop-table thead { 
                background: linear-gradient(135deg, #0d6efd, #0056b3);
                color: #fff;
            }
            .desktop-table th { 
                padding: 16px 12px;
                text-align: center;
                font-weight: 600;
                font-size: 0.9rem;
                border: none;
            }
            .desktop-table td { 
                padding: 14px 12px;
                text-align: center;
                border-bottom: 1px solid var(--global-border);
                font-size: 0.9rem;
            }
            .desktop-table tbody tr:hover { 
                background-color: rgba(13,110,253,0.03);
                transform: scale(1.01);
                transition: all 0.2s ease;
            }
            .desktop-table tbody tr:last-child td {
                border-bottom: none;
            }
        }
        @media (max-width: 991px) {
            .desktop-table { display: none; }
        }

        /* فیلد تاریخ - Mobile App Style */
        .datepicker-input {
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.95rem;
            border: 1px solid #e0e0e0;
            width: 100%;
            transition: all 0.3s ease;
        }
        .datepicker-input:focus {
            border-color: var(--global-accent);
            box-shadow: 0 0 0 3px rgba(13,110,253,0.1);
            outline: none;
            border-width: 2px;
        }
    </style>

    {% block extra_css %}{% endblock %}

</head>
<body>

<!-- Header -->
<div class="top-buttons">
    <a href="{% url 'home' %}" class="btn btn-outline-primary">صفحه اصلی</a>
    <a href="{% url 'go_dashboard' %}" class="btn btn-outline-secondary">داشبورد</a>
</div>

<!-- Main Content -->
{% block content %}{% endblock %}

<!-- JS -->
<!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>-->
<script src="{% static 'issuance/persian-date.js' %}"></script>
<script src="{% static 'issuance/persian-datepicker.js' %}"></script>

<!-- Global Theme JS -->
<script src="{% static 'global/js/theme.js' %}"></script>

{% block extra_js %}{% endblock %}
{% include "pwa/scripts.html" %}
</body>
</html>
